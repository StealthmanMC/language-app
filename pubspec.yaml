name: language_app
description: A gamified Indian language learning platform for Hindi and Telugu.

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI and Design
  cupertino_icons: ^1.0.6

  # Backend & Database
  supabase_flutter: ^1.10.0
  postgres: ^2.4.6

  # State Management
  provider: ^6.0.0

  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  sqflite: ^2.2.8
  path: ^1.8.3

  # Audio
  just_audio: ^0.9.34
  record: ^5.1.0
  flutter_sound: ^9.2.13

  # Security & Storage
  flutter_secure_storage: ^9.0.0

  # Utilities
  intl: ^0.19.0
  uuid: ^4.0.0
  http: ^1.1.0
  json_serializable: ^6.7.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0
  build_runner: ^2.4.0
  hive_generator: ^2.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/audio/
    - assets/data/

  fonts:
    - family: Devanagari
      fonts:
        - asset: assets/fonts/devanagari.ttf
    - family: Telugu
      fonts:
        - asset: assets/fonts/telugu.ttf
